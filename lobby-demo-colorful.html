<style>
.demo-wrap{max-width:1120px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:1}
.gallery{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:10px 0}
.stage{position:relative;flex:1 1 320px;max-width:344px;height:438px;border-radius:26px;overflow:hidden;
  background:linear-gradient(150deg,var(--bg1),var(--bg2));
  box-shadow:0 18px 46px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.3);
  border:1px solid rgba(255,255,255,.22);transition:transform .4s,box-shadow .4s}
.stage:hover{transform:translateY(-8px);box-shadow:0 26px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.38)}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 60% at 72% 82%, var(--glow), transparent 70%);opacity:.55;pointer-events:none}
.stage .scrim{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);z-index:2;pointer-events:none}
.stage .char{position:absolute;right:-2%;bottom:0;height:94%;width:auto;transform-origin:bottom right;filter:drop-shadow(0 12px 26px rgba(0,0,0,.45));transition:transform .45s;z-index:1}
.stage:hover .char{transform:translateY(-12px) scale(1.04)}
.stage .spark{position:absolute;color:#fff;opacity:.9;font-size:16px;text-shadow:0 0 8px rgba(255,255,255,.8);animation:tw 3s ease-in-out infinite;z-index:3}
@keyframes tw{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.2);opacity:1}}
.stage .go{position:absolute;left:18px;top:16px;z-index:4;font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.22);padding:6px 13px;border-radius:999px;backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.32)}
.stage .label{position:absolute;left:16px;bottom:18px;z-index:4;max-width:62%;background:rgba(10,8,20,.46);backdrop-filter:blur(4px);padding:12px 15px;border-radius:15px;border:1px solid rgba(255,255,255,.16)}
.stage .label .nm{font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);letter-spacing:.04em}
.stage .label .ds{font-size:13px;font-weight:500;color:rgba(255,255,255,.96);margin-top:6px;line-height:1.55}
</style>
</head>
