<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云境 · 一致性自检</title>
<link rel="icon" href="assets/yj-favicon.ico" sizes="48x48">
<link rel="icon" href="assets/yj-icon-192.png" sizes="192x192" type="image/png">
<style>
body{background:#12141d;color:#e8e4d8;font:14px/1.7 "Microsoft YaHei",sans-serif;padding:20px;max-width:860px;margin:0 auto}
h1{color:#e0a84c;font-size:20px}
.item{padding:8px 12px;border-left:3px solid #555;margin:6px 0;background:#1c2030;border-radius:6px}
.ok{border-color:#6fbf73}.fail{border-color:#e05c5c}.warn{border-color:#e0a84c}
b{font-family:monospace}
#sum{position:sticky;top:0;background:#12141d;padding:10px 0;font-size:16px}
button{padding:10px 22px;background:#e0a84c;color:#16181f;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-bottom:14px}
</style>
</head>
<body class="page-selftest">
<h1>🩺 云境 · 一致性自检</h1>
<button onclick="runAll()">▶ 运行全部检查</button>
<div id="sum"></div><div id="out"></div>
<script>
const ENGINE_VER = '4.09.0';
const ENGINES = ['js/world-runtime.js','js/world-bus.js','js/module-forge.js','js/combat-core.js','js/rpg-quests.js','js/rpg-core.js','js/quest-chain.js','js/world-stage.js','js/story-hooks.js','js/world-director.js','js/world-legacy.js','js/world-ext/world-ext-core.js','js/player-kit.js','js/knowledge-manager.js','js/kb-vector.js','js/st-import.js','js/store-guard.js','js/mobile-fit.js','js/id-migrate.js','js/preset-io.js','js/regex-io.js','js/ai-message-builder.js','js/ai-response-handler.js','js/opportunity-system.js','js/world-alive.js'];
const GENRES = ["mystery","scifi","wuxia","cthulhu","free","swallowedstar","shrouding","quanzhigaoshou","doupocangqiong","wanmeishijie","douluodalu","daoguiyixian","zhongshengdushi","dibao","longzu","quanzhifashi","limingzhijian","lunhuileyuan","wulianfengdian","shengxu","shenmifusu","ditandali","fanrenxiuxian","xianni","earth","freeworld","quanqiubingfeng","chaoshenxueyuan","zhanhen","jianlai","guimi","guzhenren","xuanjianxianzu","dazhuzai","wudongqiankun","yuanzun","wanxiangzhiwang","wangyou"];
function item(cls, name, detail){ const d=document.getElementById('out'); d.insertAdjacentHTML('beforeend', `<div class="item ${cls}">${cls==='ok'?'✅':cls==='fail'?'❌':'⚠️'} <b>${name}</b> — ${detail}</div>`); return cls==='ok'?1:cls==='fail'?0:1; }
let pass=0,total=0;
async function getText(f){
  try{ const r=await fetch(f+'?t='+Date.now()); if(!r.ok) throw new Error('HTTP '+r.status); return {ok:true,text:await r.text()}; }
  catch(e){ return {ok:false,err:String(e&&e.message||e)}; }
}
async function runAll(){
  const out=document.getElementById('out'); out.innerHTML=''; pass=0; total=0;
  if(location.protocol==='file:'){
    document.getElementById('sum').innerHTML='<b style="color:#e0a84c">⚠️ 当前以 file:// 方式打开，浏览器禁止本地 fetch，自检无法读取项目文件。</b><br>请用本地服务器打开：在项目根目录执行 <code>python3 -m http.server 8080</code>，再访问 <b>http://localhost:8080/selftest.html</b>';
    return;
  }
  // ① 引擎语法
  for (const f of ENGINES){
    const g=await getText(f);
    if(!g.ok){ total++; pass+=item('fail','语法 '+f,'获取失败：'+g.err); continue; }
    try{ new Function(g.text); total++; pass+=item('ok','语法 '+f,'解析通过'); }catch(e){ total++; pass+=item('fail','语法 '+f,e.message); }
  }
  // ② 每界四件套存在性(config/ext/css + 引擎注册)
  for (const g of GENRES){
    const need=[`configs/${g}-config.js`,`js/world-ext/${g}-ext.js`,`css/${g}-style.css`];
    let miss=[];
    for(const n of need){ try{ const r=await fetch(n+'?t='+Date.now()); if(!r.ok) miss.push(n); }catch(e){ miss.push(n); } }
    total++; pass+=miss.length?item('fail','资源四件套 '+g,'缺 '+miss.join(',')):item('ok','资源四件套 '+g,'config/ext/css 齐全');
  }
  // ②b v4.05.0 共用资源：网游多标签皮肤 + 视觉增强皮肤 + 两张舆图纹章（Agnes 免费生图素材）
  {
    const need=['css/rpg-suite.css','css/rpg-polish-405.css','assets/atlas/compass-rose.png','assets/atlas/rpg-hud-crest.png'];
    let miss=[];
    for(const n of need){ try{ const r=await fetch(n+'?t='+Date.now()); if(!r.ok) miss.push(n); }catch(e){ miss.push(n); } }
    total++; pass+=miss.length?item('fail','v4.05.0 共用资源','缺 '+miss.join(',')):item('ok','v4.05.0 共用资源','皮肤 + 视觉增强 + 两张舆图纹章齐全');
  }
  // ③ 引擎阵容注册
  const c=await getText('js/combat-core.js');
  const missC=c.ok?GENRES.filter(g=>!c.text.includes(g+':{')):GENRES;
  total++; pass+=missC.length?item('fail','战斗注册',c.ok?`缺 ${missC.join(',')}`:'文件获取失败'):item('ok','战斗注册',`${GENRES.length} 界阵容齐全`);
  const q=await getText('js/quest-chain.js');
  const missQ=q.ok?GENRES.filter(g=>!q.text.includes(g+':{')):GENRES;
  total++; pass+=missQ.length?item('fail','主线注册',q.ok?`缺 ${missQ.join(',')}`:'文件获取失败'):item('ok','主线注册',`${GENRES.length} 界章节齐全`);
  const s=await getText('js/world-stage.js');
  const missS=s.ok?GENRES.filter(g=>!s.text.includes(g+':{')):GENRES;
  total++; pass+=missS.length?item('fail','阶段注册',s.ok?`缺 ${missS.join(',')}`:'文件获取失败'):item('ok','阶段注册',`${GENRES.length} 界时代齐全`);
  // ④ 大厅卡=validGenres=标题计数
  const idx=await getText('index.html');
  const stu=await getText('studio.html');
  if(idx.ok && stu.ok){
    const cardIds=[...new Set([...idx.text.matchAll(/genre=([a-z]+)/g)].map(m=>m[1]))];
    const vgM=stu.text.match(/validGenres\s*=\s*\[([^\]]+)\]/);
    const vg=vgM?[...new Set([...vgM[1].matchAll(/"([a-z]+)"/g)].map(m=>m[1]))]:[];
    const onlyCard=cardIds.filter(g=>!vg.includes(g)), onlyVg=vg.filter(g=>!cardIds.includes(g));
    total++; pass+=(onlyCard.length||onlyVg.length)?item('fail','大厅卡 vs validGenres',`卡多:${onlyCard} 表多:${onlyVg}`):item('ok','大厅卡 vs validGenres',`${cardIds.length}=${vg.length} 完全一致`);
    const headM=idx.text.match(/全站\s*([0-9]+)\s*界/)||idx.text.match(/开放世界扮演\s*·\s*([0-9]+)\s*界/);
    total++; pass+=headM&&parseInt(headM[1])===GENRES.length?item('ok','大厅计数文案',`标题 ${headM[1]} 界 = 实际 ${GENRES.length}`):item('fail','大厅计数文案',`标题「${headM?headM[1]:'未找到'}」≠ 实际 ${GENRES.length} 界`);
    const needInStu=['store-guard.js','st-import.js','ui-polish.css','sw.js'];
    const missW=needInStu.filter(n=>!stu.text.includes(n));
    total++; pass+=missW.length?item('fail','studio 挂载',`未引用 ${missW}`):item('ok','studio 挂载','防线/导入/优化/离线均已接线');
  } else {
    total+=2; pass+=item('fail','大厅对比','index/studio 获取失败：'+((!idx.ok)?idx.err:'')+((!stu.ok)?stu.err:''));
  }
  // ⑤ 跨界泄漏嗅探:新界 forge 段必须是惰性工厂
  const f=await getText('js/module-forge.js');
  const eager=f.ok?GENRES.filter(g=>new RegExp(g+':\\[').test(f.text)):[];
  total++; pass+=eager.length?item('fail','forge 惰性构造',`急切键:${eager}`):item('ok','forge 惰性构造','全部为 function(){return} 工厂');
  // 总结
  document.getElementById('sum').innerHTML=`<b style="color:${pass===total?'#6fbf73':'#e05c5c'}">${pass}/${total} 项通过${pass===total?' · 全部健康':' · 有问题需修'}</b>`;
}
</script>
</body>
</html>
