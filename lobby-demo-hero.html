<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>云境 · 大厅概念</title>
<link rel="stylesheet" href="css/lobby-xiaoyun.css?v=3.88.0">
<style>
.demo-wrap{max-width:1080px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:1}
.hero-row{display:flex;gap:22px;align-items:stretch;margin:6px 0 10px}
.hero-panel{flex:1;min-height:400px;border-radius:24px;position:relative;overflow:hidden;padding:42px;display:flex;flex-direction:column;justify-content:flex-end;--h:#8ab4c8;
  background:radial-gradient(130% 100% at 78% 8%, color-mix(in srgb,var(--h) 42%, transparent), transparent 55%), linear-gradient(160deg, color-mix(in srgb,var(--h) 24%, #14111f), #0e0b16);
  border:1px solid color-mix(in srgb,var(--h) 40%, rgba(255,255,255,.08));box-shadow:0 20px 54px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);transition:.3s}
.hero-glyph{position:absolute;right:-30px;bottom:-60px;font-size:300px;font-weight:800;color:color-mix(in srgb,var(--h) 34%, transparent);opacity:.42;pointer-events:none;line-height:1;z-index:0}
.hero-panel h3{position:relative;font-size:34px;margin:0 0 12px;color:#fff;letter-spacing:.05em;z-index:2}
.hero-panel p{position:relative;margin:0;max-width:430px;color:var(--ink-dim);line-height:1.9;font-size:15px;z-index:2}
.hero-go{position:relative;display:inline-block;margin-top:20px;align-self:flex-start;font-size:15px;font-weight:600;color:#fff;padding:11px 22px;border-radius:999px;text-decoration:none;background:color-mix(in srgb,var(--h) 82%, #1a1530);box-shadow:0 8px 22px color-mix(in srgb,var(--h) 50%, transparent);z-index:2}
.hero-list{flex:0 0 252px;display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.hero-list li{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;cursor:pointer;background:rgba(255,255,255,.045);border:1px solid rgba(180,200,255,.12);color:var(--ink);font-size:16px;transition:.25s}
.hero-list li .dot{width:12px;height:12px;border-radius:50%;background:var(--h);box-shadow:0 0 10px var(--h);flex:0 0 auto}
.hero-list li.on,.hero-list li:hover{background:color-mix(in srgb,var(--h) 22%, rgba(255,255,255,.05));border-color:color-mix(in srgb,var(--h) 50%, transparent);transform:translateX(4px)}
</style>
</head>
<body class="page-index" data-skin="night">
<div class="stars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="demo-wrap">
<header class="masthead">
  <div class="logo-kai"><span class="lk-a">云</span><span class="lk-b">境</span></div>
  <div class="sub">万象入云 · 一念一世界</div>
</header>
<section style="margin-top:18px"><h2 class="section-title">五大创作工坊</h2><div class="hero-row"><div class="hero-panel" id="heroPanel"><span class="hero-glyph" id="heroGlyph">疑</span><h3 id="heroName">悬疑推理坊</h3><p id="heroDesc">迷雾中的每一处线索，都通向真相。在反转与伏笔里，写出让人脊背发凉的推理。</p><a class="hero-go" href="#">进入创作 →</a></div><ul class="hero-list"><li class="on" style="--h:#8ab4c8" data-name="悬疑推理坊" data-desc="迷雾中的每一处线索，都通向真相。在反转与伏笔里，写出让人脊背发凉的推理。" data-glyph="疑"><span class="dot"></span>悬疑推理坊</li><li style="--h:#6fc2b4" data-name="科幻星舰坊" data-desc="跃迁到光年之外的文明现场。硬核设定与人文思辨，构筑你的未来宇宙。" data-glyph="星"><span class="dot"></span>科幻星舰坊</li><li style="--h:#9fbf8f" data-name="武侠江湖坊" data-desc="刀光剑影里写一段快意恩仇。门派、秘籍、恩怨，还原一个有血有肉的江湖。" data-glyph="侠"><span class="dot"></span>武侠江湖坊</li><li style="--h:#b7a8e8" data-name="克苏鲁秘坊" data-desc="在不可名状的低语中坠落。古神、疯癫与未知，触碰人类认知的边界。" data-glyph="诡"><span class="dot"></span>克苏鲁秘坊</li><li style="--h:#e0a84c" data-name="自由创作坊" data-desc="没有规则，只有你的想象。散文、诗歌、剧本、世界观——一切皆可落笔成书。" data-glyph="由"><span class="dot"></span>自由创作坊</li></ul></div></section>
<section style="margin-top:34px"><h2 class="section-title">开放世界 · 28 界</h2>
  <p style="text-align:center;color:var(--ink-dim);max-width:640px;margin:0 auto;line-height:1.9">从悬疑到科幻，从武侠到异神——踏入由你与他人共创的原著世界，每一步都是新的故事。</p></section>
</div>
<script>
var lis=document.querySelectorAll('.hero-list li');var p=document.getElementById('heroPanel');
function show(a){var h=a.style.getPropertyValue('--h');p.style.setProperty('--h',h);document.getElementById('heroGlyph').textContent=a.dataset.glyph;document.getElementById('heroName').textContent=a.dataset.name;document.getElementById('heroDesc').textContent=a.dataset.desc;lis.forEach(function(x){x.classList.remove('on')});a.classList.add('on');}
lis.forEach(function(a){a.addEventListener('click',function(){show(a)})});
</script>
</body></html>
