<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>云境 · 大厅概念</title>
<link rel="stylesheet" href="css/lobby-xiaoyun.css?v=3.87.0">
<style>
.demo-wrap{max-width:1080px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:1}
.avatar-wall{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;margin:14px 0 26px}
.avatar{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:44px;font-weight:800;color:#fff;text-decoration:none;position:relative;
  background:radial-gradient(circle at 35% 28%, color-mix(in srgb,var(--h) 75%, #fff), color-mix(in srgb,var(--h) 55%, #16121f));
  border:2px solid color-mix(in srgb,var(--h) 60%, transparent);
  box-shadow:0 10px 26px color-mix(in srgb,var(--h) 45%, transparent), inset 0 2px 8px rgba(255,255,255,.4);transition:transform .3s,box-shadow .3s}
.avatar:hover,.avatar.on{transform:translateY(-6px) scale(1.06);box-shadow:0 16px 38px color-mix(in srgb,var(--h) 60%, transparent),0 0 0 4px color-mix(in srgb,var(--h) 25%, transparent)}
.avatar small{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-size:14px;color:var(--ink-dim);white-space:nowrap;font-weight:600}
.av-detail{margin:44px auto 0;max-width:720px;min-height:140px;border-radius:22px;padding:30px 34px;--h:#8ab4c8;
  background:linear-gradient(150deg, color-mix(in srgb,var(--h) 18%, #15111f), #100d18);
  border:1px solid color-mix(in srgb,var(--h) 35%, rgba(255,255,255,.08));
  box-shadow:0 16px 44px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);transition:.3s}
.av-detail h3{margin:0 0 10px;font-size:24px;color:#fff;letter-spacing:.05em}
.av-detail p{margin:0;color:#cfcbe8;line-height:1.9;font-size:15px}
.av-detail .tag{display:inline-block;margin-top:14px;font-size:13px;color:#fff;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--h) 65%, #2a2540)}
</style>
</head>
<body class="page-index" data-skin="night">
<div class="stars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="demo-wrap">
<header class="masthead">
  <div class="logo-kai"><span class="lk-a">云</span><span class="lk-b">境</span></div>
  <div class="sub">万象入云 · 一念一世界</div>
</header>
<section style="margin-top:18px"><h2 class="section-title">五大创作工坊</h2><div class="avatar-wall"><button class="avatar on" style="--h:#8ab4c8" data-name="悬疑推理坊" data-desc="迷雾中的每一处线索，都通向真相。在反转与伏笔里，写出让人脊背发凉的推理。">疑<small>悬疑推理坊</small></button><button class="avatar" style="--h:#6fc2b4" data-name="科幻星舰坊" data-desc="跃迁到光年之外的文明现场。硬核设定与人文思辨，构筑你的未来宇宙。">星<small>科幻星舰坊</small></button><button class="avatar" style="--h:#9fbf8f" data-name="武侠江湖坊" data-desc="刀光剑影里写一段快意恩仇。门派、秘籍、恩怨，还原一个有血有肉的江湖。">侠<small>武侠江湖坊</small></button><button class="avatar" style="--h:#b7a8e8" data-name="克苏鲁秘坊" data-desc="在不可名状的低语中坠落。古神、疯癫与未知，触碰人类认知的边界。">诡<small>克苏鲁秘坊</small></button><button class="avatar" style="--h:#e0a84c" data-name="自由创作坊" data-desc="没有规则，只有你的想象。散文、诗歌、剧本、世界观——一切皆可落笔成书。">由<small>自由创作坊</small></button></div><div class="av-detail" id="avDetail"><h3>悬疑推理坊</h3><p>迷雾中的每一处线索，都通向真相。在反转与伏笔里，写出让人脊背发凉的推理。</p><span class="tag">进入创作 →</span></div></section>
<section style="margin-top:34px"><h2 class="section-title">开放世界 · 28 界</h2>
  <p style="text-align:center;color:var(--ink-dim);max-width:640px;margin:0 auto;line-height:1.9">从悬疑到科幻，从武侠到异神——踏入由你与他人共创的原著世界，每一步都是新的故事。</p></section>
</div>
<script>
var avs=document.querySelectorAll('.avatar');var det=document.getElementById('avDetail');
function show(a){var h=a.style.getPropertyValue('--h');det.style.setProperty('--h',h);det.querySelector('h3').textContent=a.dataset.name;det.querySelector('p').textContent=a.dataset.desc;avs.forEach(function(x){x.classList.remove('on')});a.classList.add('on');}
avs.forEach(function(a){a.addEventListener('click',function(){show(a)})});
</script>
</body></html>
