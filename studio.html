    <script>
        /* 响应式模式：≤900px 挂 mobile 类（含桌面缩窗），≤380px 再挂 narrow
           注意：脚本位于 head，body 可能尚未解析——先判空，DOMContentLoaded 再补一次 */
        (function () {
            let lastMobile = null;
            function fitMode() {
                if (!document.body) return;
                const coarse = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
                const isMobile = window.innerWidth <= 900 || (coarse && window.innerWidth <= 1100);
                document.body.classList.toggle('mobile', isMobile);
                document.body.classList.toggle('narrow', window.innerWidth <= 380);
                // v3.13.1 修复：跨断点（缩窗/旋转/开发者工具开合）时清理抽屉残留——
                // 旧版在桌面宽窗点过「状态面板」会挂上 .open/.show（桌面无样式、用户无感知），
                // 之后窗口缩到 <900px 切入抽屉模式，残留的 .open 会让面板/backdrop 凭空弹出挡屏
                if (lastMobile !== null && lastMobile !== isMobile) {
                    const panel = document.getElementById('statusPanel');
                    const backdrop = document.getElementById('panelBackdrop');
                    if (panel) panel.classList.remove('open', 'pulse');
                    if (backdrop) backdrop.classList.remove('show');
                }
                lastMobile = isMobile;
                // 手机端用短占位符，避免被截成"给主笔 A…"
                const inp = document.getElementById('userInput');
                if (inp) inp.placeholder = isMobile ? '给主笔 AI 的指令…' : '给主笔 AI 下一道指令…（回车发送，或点上方快捷指令）';
            }
            window.addEventListener('resize', fitMode);
            window.addEventListener('orientationchange', fitMode);
            document.addEventListener('DOMContentLoaded', fitMode);
            window.addEventListener('load', fitMode);
            fitMode();
        })();
    </script>
